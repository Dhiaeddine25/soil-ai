<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoilAI – Diagnostic sol par IA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1e2a1e;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c5f2d;
    }
    .private-badge {
      color: #4a6741;
      font-size: 0.85rem;
      background: #f0f4e8;
      padding: 4px 12px;
      border-radius: 30px;
    }
    .header-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .lang-btn {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
    }
    .signin-btn {
      background: #2c5f2d;
      color: white;
      border: none;
      padding: 6px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1e3a1e;
      max-width: 800px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .header { flex-direction: column; text-align: center; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">SoilAI</div>
    <div class="private-badge">Privé</div>
    <div class="header-actions">
      <button class="lang-btn">FR</button>
      <button id="signinBtn" class="signin-btn">Se connecter</button>
    </div>
  </header>

<div class="hero">
  <h1>Analyse de sol par intelligence artificielle</h1>
</div>

<script>
  document.getElementById("signinBtn")?.addEventListener("click", () => {
    alert("Page de connexion – à implémenter");
  });
</script>

</body>
</html>
